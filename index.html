<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christmas Time</title>

<meta name="description"
content="Em breve o Natal em sua expressão mais elegante.">

<meta property="og:title"
content="Christmas Time">

<meta property="og:description"
content="Em breve o Natal em sua expressão mais elegante.">

<meta property="og:type"
content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
    --gold:#d7bd8a;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:'Cormorant Garamond', serif;

    background:
        linear-gradient(
            rgba(0,0,0,.18),
            rgba(0,0,0,.35)
        ),
        url('hero.webp.jfif');

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    overflow:hidden;
}

/* Vinheta elegante */

body::before{

    content:'';

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            ellipse at center,
            rgba(0,0,0,0) 40%,
            rgba(0,0,0,.20) 100%
        );
}

/* Conteúdo */

.hero{

    position:relative;

    z-index:2;

    width:100%;
    height:100vh;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    text-align:center;

    padding-top:22vh;
}

.content{

    max-width:900px;

    animation:fadeIn 2s ease;
}

.content{

    max-width:900px;

    animation:fadeIn 2s ease;

    background:linear-gradient(
        to bottom,
        rgba(20,20,20,0.08),
        rgba(20,20,20,0.22)
    );

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    padding:50px 70px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 10px 40px rgba(0,0,0,.12);
}
    
.brand{

    color:white;

    letter-spacing:14px;

    text-transform:uppercase;

    font-size:1.15rem;

    margin-bottom:30px;

    opacity:.95;
}

.line{

    width:90px;
    height:1px;

    background:var(--gold);

    margin:0 auto 40px auto;
}

h1{

    color:white;

    font-weight:300;

    font-size:clamp(5rem,10vw,9rem);

    line-height:.9;

    margin-bottom:20px;

    text-shadow:
        0 5px 30px rgba(0,0,0,.30);
}

.subtitle{

    color:white;

    font-size:clamp(
        1.3rem,
        2vw,
        2rem
    );

    font-weight:300;

    text-shadow:
        0 3px 20px rgba(0,0,0,.30);
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){

    body{
        background-position:20% center;
    }

    .brand{
        font-size:.95rem;
        letter-spacing:8px;
    }

    h1{
        font-size:4.5rem;
    }

    .subtitle{
        font-size:1.25rem;
    }

.content{

    width:90%;

    padding:25px;

    backdrop-filter:blur(6px);
}
}

</style>

</head>

<body>

<section class="hero">

    <div class="content">

        <div class="brand">
            CHRISTMAS TIME
        </div>

        <div class="line"></div>

        <h1>
            Em Breve
        </h1>

        <p class="subtitle">
            O Natal em sua expressão mais elegante.
        </p>

    </div>

</section>

</body>

</html>
